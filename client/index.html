<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <title>中国历史地图 · 宋朝</title>
  </head>
  <body>
    <div id="app">
      <!-- 极简顶栏：品牌 + 右上操作 -->
      <header id="topbar">
        <div class="brand">
          <span class="brand-title">历史地图</span>
          <span class="brand-seal">宋</span>
        </div>
        <div class="top-actions">
          <button id="allperiod-toggle" class="top-btn" title="全时期模式：按年份展示当时全部政权" aria-label="全时期模式" aria-pressed="false">
            <span class="top-btn-icon" aria-hidden="true">⌖</span><span class="top-btn-label">全时期</span>
          </button>
          <select id="dynasty-select" title="选择朝代" aria-label="选择朝代"></select>
          <button id="log-toggle" class="top-btn" title="历史事件流" aria-label="打开历史事件流" aria-controls="event-log" aria-expanded="false">
            <span class="top-btn-icon" aria-hidden="true">☰</span><span class="top-btn-label">事件</span>
            <span id="log-badge" class="hidden" aria-hidden="true"></span>
          </button>
          <button id="settings-btn" class="top-btn" title="设置" aria-label="打开设置" aria-controls="settings-panel" aria-expanded="false">
            <span class="top-btn-icon" aria-hidden="true">⚙</span><span class="top-btn-label">设置</span>
          </button>
        </div>
      </header>

      <!-- 全屏 3D 场景 -->
      <div id="scene-container" role="application" aria-label="中国历史地图，可通过时间轴浏览历史事件">
        <div id="year-watermark" aria-live="polite"></div>
        <div id="legend" class="hidden" role="region" aria-label="政权图例"></div>
      </div>

      <!-- 右侧事件流抽屉（默认收起） -->
      <aside id="event-log" class="collapsed" role="region" aria-labelledby="event-log-title" aria-hidden="true">
        <div class="log-header">
          <span id="event-log-title">历史事件</span>
          <button id="log-close" type="button" title="收起事件流" aria-label="收起事件流">×</button>
        </div>
        <div class="log-search">
          <input type="text" id="log-search-input" placeholder="搜索事件…" aria-label="搜索事件">
        </div>
        <div class="log-list" role="list" aria-live="polite"></div>
      </aside>

      <!-- 详情 / 设置面板 -->
      <div id="detail-mask" class="hidden" role="presentation" aria-hidden="true"></div>
      <aside id="detail-panel" class="hidden" role="dialog" aria-modal="true" aria-labelledby="detail-title" aria-hidden="true"></aside>
      <aside id="settings-panel" class="hidden" role="dialog" aria-modal="true" aria-labelledby="settings-title" aria-hidden="true"></aside>

      <!-- 朝代更替全屏转场横幅（跨时期边界时显示，如 1127 靖康） -->
      <div id="era-banner">
        <div class="era-banner-inner">
          <div class="era-banner-year"></div>
          <div class="era-banner-text"></div>
        </div>
      </div>

      <!-- 底部居中悬浮时间轴控制条 -->
      <div id="timeline">
        <button id="tl-play">▶ 播放</button>
        <div class="tl-main">
          <div class="tl-year-wrap">
            <span id="tl-year">960年1月</span>
            <span class="tl-range">960 — 1279</span>
          </div>
          <div id="tl-track">
            <div id="tl-progress"></div>
            <div id="tl-markers"></div>
            <div id="tl-thumb"></div>
            <div id="tl-ticks"></div>
          </div>
        </div>
        <div class="tl-hint">空格 播放/暂停 · ← → 逐月</div>
      </div>

      <div id="loading">正在加载历史数据…</div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
