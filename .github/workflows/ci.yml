name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint, Test & Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Node 20 runner 已弃用（actions 被强制跑在 Node 24，setup-node 安装 Node 20
      # 存在间歇兼容问题）；vitest4/vite5/better-sqlite3 均兼容 Node 24
      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json
            server/package-lock.json

      # npm ci 加网络重试：CI 偶发 registry 拉取瞬时失败（历史 3 次 flaky 均为此类）
      - name: Install root dependencies
        run: npm ci --fetch-retries=5 --fetch-retry-mintimeout=20000

      - name: Install client dependencies
        run: npm --prefix client ci --fetch-retries=5 --fetch-retry-mintimeout=20000

      - name: Install server dependencies
        run: npm --prefix server ci --fetch-retries=5 --fetch-retry-mintimeout=20000

      - name: Lint
        run: npm run lint

      - name: Run unit tests
        run: npm run test

      - name: Build client (production)
        run: npm run build
