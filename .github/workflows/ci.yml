name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint, Test & Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 无 npm workspaces：根 / client / server 三处独立 package.json 与 lockfile
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json
            server/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install client dependencies
        run: npm --prefix client ci
        continue-on-error: true   # 临时诊断：失败不中断，走 Diagnose 步骤输出原因

      # 临时诊断步骤（定位首次 CI 失败后移除）
      - name: Diagnose client install
        if: always()
        run: |
          node -v
          npm -v
          echo "--- lockfile head ---"
          node -e "const l=require('./client/package-lock.json'); console.log('lockfileVersion:', l.lockfileVersion, '| packages:', Object.keys(l.packages||{}).length)"
          echo "--- npm ls client (exit tolerated) ---"
          (cd client && npm ls --depth=0 2>&1 | head -30) || true

      - name: Install server dependencies
        run: npm --prefix server ci

      - name: Lint
        run: npm run lint

      - name: Run unit tests
        run: npm run test

      - name: Build client (production)
        run: npm run build
